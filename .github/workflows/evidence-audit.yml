name: Evidence audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/generate_checkpoint_manifest.py
      - run: python tools/validate_evidence.py
      - run: python -m unittest discover -s tests -v
